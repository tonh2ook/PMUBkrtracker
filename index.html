<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ติดตามผลผลิตโครงการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F9; --surface:#FFFFFF; --sunk:#F6F8FA; --ink:#141C3A; --ink2:#465366; --muted:#6B778A;
  --line:#D9DFE7; --line2:#E8ECF1;
  --primary:#3156D3; --primary-ink:#FFFFFF; --primary-soft:#E6ECFD;
  --ok:#14804A; --ok-soft:#DDF3E6; --pend:#C77C02; --pend-soft:#FCEFD6; --risk:#C2410C; --risk-soft:#FDE5D8;
  --late:#B42318; --late-soft:#FCE2E0; --empty:#C9D1DC;
  --side:#141C3A; --side-ink:#C3CAE0; --side-muted:#7D87A8;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --r:10px;
  --ui:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,sans-serif; --doc:'Sarabun','IBM Plex Sans Thai',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);font-size:15px;line-height:1.55;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
a{color:var(--primary)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;padding:3px}
.mark img{width:100%;height:100%;object-fit:contain}
.back{color:var(--side-ink);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1000px 520px at 15% -10%,#2c3f86 0,transparent 60%),#141C3A;font-family:var(--ui)}
.gcard{background:#fff;color:#18213a;border-radius:18px;padding:34px 30px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gcard img{width:150px;height:84px;object-fit:contain;margin-bottom:10px}
.gcard h1{font-size:21px;margin:0 0 6px}
.gcard p{color:#6c7590;margin:0 0 20px;font-size:14px}
.gcard a{display:block;background:#3156d3;color:#fff;border-radius:10px;padding:11px;font-weight:600;text-decoration:none}
.brand b{display:block;font-size:15px;line-height:1.25}
.brand span{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;font-size:14.5px;color:var(--side-ink)}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);font-weight:600}
.nav button:focus-visible{outline:2px solid #fff}
.nav .count{margin-left:auto;background:var(--pend);color:#1b1300;font-size:11.5px;font-weight:700;border-radius:20px;padding:0 7px;line-height:19px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.d3btn{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;border-radius:12px;background:#202844;border:1px solid rgba(255,255,255,.14);color:#c3cae0;font-weight:600;font-size:15px;text-decoration:none}
.d3btn svg,.outlink svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.d3btn:hover{background:#2a3352;color:#fff}
.sync{display:flex;align-items:center;gap:9px;font-size:14px;color:#c3cae0;background:#222946;border-radius:10px;padding:9px 12px}
.sync i{width:9px;height:9px;border-radius:50%;background:#4cd18a;flex:none}
.sync.none i{background:#7d87a8}
.foot-meta{font-size:12.5px;color:var(--side-muted);line-height:1.6;padding:0 2px}
.foot-meta b{color:#c3cae0;font-weight:700}
.outlink{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--side-muted);font-size:14px;padding:8px 2px 2px}
.outlink:hover{color:#ffb4ae}
.d3btn:focus-visible,.outlink:focus-visible{outline:2px solid #fff;outline-offset:2px}

main{padding:28px 32px 80px;min-width:0}
.wrap{max-width:1360px;margin:0 auto}
.demo-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--pend-soft);border:1px solid color-mix(in srgb,var(--pend) 40%,transparent);color:var(--ink);padding:9px 14px;border-radius:var(--r);margin-bottom:20px;font-size:14px}
.demo-bar b{color:var(--pend)}
.demo-bar button{margin-left:auto}

/* type */
h1{font-size:26px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;margin:0;font-weight:600}
h3{font-size:15.5px;margin:0;font-weight:600}
.lede{color:var(--ink2);margin:6px 0 0;max-width:72ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.doc{font-family:var(--doc)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}

/* buttons & inputs */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary);padding:6px 8px}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{color:var(--late)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14.5px;width:100%;min-width:0}
textarea{resize:vertical;min-height:40px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:0;border-color:var(--primary)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink2);font-weight:500}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.panel-b{padding:14px 18px 18px}

/* overview */
.status-line{font-family:var(--doc);font-size:21px;line-height:1.5;margin:0 0 22px;max-width:62ch;color:var(--ink2)}
.status-line b{color:var(--ink);font-weight:600}
.status-line .k-ok{color:var(--ok)} .status-line .k-pend{color:var(--pend)} .status-line .k-risk{color:var(--risk)}
.ov-top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.osum{display:flex;flex-direction:column}
.osum-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(90px,1.1fr) 74px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2);font-size:14px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.osum-row:first-child{border-top:0}
.osum-row:hover .nm{color:var(--primary)}
.osum-row .no{color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.osum-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osum-row .ct{text-align:right;font-size:13.5px;color:var(--ink2)}
.osum-row .ct b{color:var(--ink)}
.osum-row.zero{cursor:default;color:var(--muted)}
.sbar{height:10px;border-radius:5px;background:var(--line2);display:flex;overflow:hidden}
.sbar i{display:block;height:100%}
.sbar .a{background:var(--ok)}
.sbar .p{background:repeating-linear-gradient(135deg,var(--pend) 0 3px,color-mix(in srgb,var(--pend) 45%,transparent) 3px 6px)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.kr-tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:5px;padding:0 6px;line-height:18px;vertical-align:1px;margin-left:6px;white-space:nowrap}

.watch{display:flex;flex-direction:column}
.watch-row{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line2)}
.watch-row:first-child{border-top:0}
.watch-row:hover .t{color:var(--primary)}
.watch-row .t{font-family:var(--doc);font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.watch-row .m{font-size:12.5px;color:var(--muted);grid-column:1}
.watch-row .chip{grid-row:1/3;grid-column:2;align-self:center}
.kr-box{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.kr-num{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.kr-num b{font-size:26px;line-height:1}
.empty-note{color:var(--muted);font-size:14px;padding:6px 0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:1px 9px;line-height:20px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-done{color:var(--ok);background:var(--ok-soft)}
.c-track{color:var(--primary);background:var(--primary-soft)}
.c-risk{color:var(--risk);background:var(--risk-soft)}
.c-late{color:var(--late);background:var(--late-soft)}
.c-nodate{color:var(--muted);background:var(--line2)}
.c-pend{color:var(--pend);background:var(--pend-soft)}
.c-ok{color:var(--ok);background:var(--ok-soft)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--primary)}
.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toolbar .grow{flex:1}
.toolbar input[type=search]{max-width:240px}
.toolbar select{width:auto}

/* matrix */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px}
.mx th,.mx td{border-bottom:1px solid var(--line2);padding:9px 6px;vertical-align:middle}
.mx thead th{font-size:12.5px;font-weight:600;color:var(--ink2);text-align:center;vertical-align:bottom;background:var(--surface);position:sticky;top:0;z-index:2;line-height:1.3;border-bottom:1px solid var(--line)}
.mx thead th .n{display:block;color:var(--muted);font-size:12px;font-weight:600}
.mx .pc{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;width:250px;min-width:250px;max-width:250px;box-shadow:1px 0 0 var(--line2)}
.mx thead .pc{z-index:3}
.mx tr.grp td{background:var(--sunk);font-size:13px;font-weight:600;color:var(--ink2);padding:6px 12px;position:sticky;left:0}
.mx tr.grp td span{font-weight:400;color:var(--muted);margin-left:6px}
.mx tbody tr.pr{cursor:pointer}
.mx tbody tr.pr:hover td{background:var(--sunk)}
.mx tbody tr.pr:hover td.pc{background:var(--sunk)}
.pc .ct{font-size:12px;color:var(--muted);display:flex;gap:8px}
.pc .tt{font-family:var(--doc);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:1px 0}
.pc .pi{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx td.cell{text-align:center;min-width:70px}
.mx td.cell button{all:unset;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border-radius:6px}
.mx td.cell button:hover{background:var(--primary-soft)}
.mx td.cell button:focus-visible{outline:2px solid var(--primary)}
.mx td.end{min-width:140px}
.mx td.cell.hi,.mx thead th.hi{background:color-mix(in srgb,var(--primary) 9%,var(--surface))}
.mx thead th.hi{color:var(--primary)}
.osum-row.on .nm{color:var(--primary);font-weight:600}
.nil{color:var(--empty);font-size:15px}
.pips{display:grid;grid-template-columns:repeat(5,9px);gap:3px;justify-content:center}
.pips.n1{grid-template-columns:9px}.pips.n2{grid-template-columns:repeat(2,9px)}.pips.n3{grid-template-columns:repeat(3,9px)}.pips.n4{grid-template-columns:repeat(4,9px)}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--empty);background:transparent}
.pip.a{background:var(--ok);border-color:var(--ok)}
.pip.p{border-color:var(--pend);background:var(--pend-soft)}
.over{font-size:11px;font-weight:700;color:var(--ok)}
.bigc{font-size:13px;color:var(--ink2);line-height:1.1}
.bigc b{color:var(--ink);font-size:14px}
.mini{width:56px;height:5px;border-radius:3px;background:var(--line2);display:flex;overflow:hidden}
.mini i{display:block;height:100%}
.mini .a{background:var(--ok)} .mini .p{background:var(--pend)}
.endcell{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.duo{display:grid;grid-template-columns:34px 70px 32px;gap:2px 6px;align-items:center;font-size:11.5px;color:var(--muted)}
.duo .bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.duo .bar i{display:block;height:100%}
.duo .t i{background:var(--ink2)} .duo .o i{background:var(--ok)}
.duo .v{text-align:right;color:var(--ink2)}

/* project view */
.picker{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.picker select{flex:1;min-width:220px;max-width:640px}
.proj-head{padding:22px 24px}
.proj-head .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.prog-tag{font-weight:600;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.proj-head h1{font-family:var(--doc);font-size:24px;font-weight:600;line-height:1.4;max-width:60ch}
.proj-head .en{color:var(--ink2);margin:6px 0 0;font-size:14.5px;max-width:80ch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 24px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:14.5px}
.pinfo{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
.pinfo summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--primary)}
.pinfo .facts{border-top:0;margin-top:10px;padding-top:0}
.partners{margin-top:14px;font-size:14px}
.partners b{font-size:12.5px;color:var(--muted);font-weight:400}
.partners ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.partners li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px}
.partners li span{font-weight:600}
.kw{margin:12px 0 0}
.pnote{margin:8px 0 0;font-size:14px;color:var(--late);background:var(--late-soft);border-radius:8px;padding:6px 10px;display:inline-block}
.pc .own{color:var(--primary);font-weight:600}
.timebox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--sunk);border:1px solid var(--line2)}
.tl{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;gap:6px 12px;align-items:center;font-size:13.5px}
.tl .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.tl .bar i{display:block;height:100%}
.tl .t i{background:var(--ink2)} .tl .o i{background:var(--ok)}
.tl .v{text-align:right;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 0}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--primary);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--primary)}
.tabs .sp{flex:1}
.items{display:flex;flex-direction:column}
.item{border-bottom:1px solid var(--line2);padding:14px 4px}
.item-h{display:grid;grid-template-columns:28px minmax(0,1fr) 140px 120px auto;gap:12px;align-items:center}
.item-h .no{font-weight:700;color:var(--muted);text-align:right}
.item-h .nm{font-weight:500}
.item-h .nm small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.item.zero .nm{color:var(--muted)}
.ibar{display:flex;align-items:center;gap:8px}
.ibar .sbar{flex:1}
.icount{font-size:13.5px;color:var(--ink2);text-align:right}
.icount b{font-size:16px;color:var(--ink)}
.subs{margin:10px 0 0 40px;display:grid;gap:6px}
.sub{display:grid;grid-template-columns:minmax(0,1fr) 140px 120px;gap:12px;align-items:center;font-size:13.5px;color:var(--ink2);padding-right:120px}
.evs{list-style:none;margin:10px 0 0 40px;padding:0;display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:13.5px}
.ev .tt{font-weight:500;color:var(--ink)}
.ev .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.ev .acts{display:flex;gap:2px}
.ev.pend{background:var(--pend-soft)}
.more{margin:6px 0 0 36px}

/* intake */
.intake-meta{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr;gap:14px;padding:18px}
.irow{display:grid;grid-template-columns:28px minmax(0,1.2fr) 70px 80px 190px minmax(0,1.5fr);gap:12px;align-items:start;padding:12px 18px;border-top:1px solid var(--line2)}
.irow.head{font-size:12.5px;color:var(--muted);font-weight:600;padding-top:10px;padding-bottom:10px;background:var(--sunk);align-items:end}
.irow .no{font-weight:700;color:var(--muted);text-align:right;padding-top:8px}
.irow .nm{padding-top:8px;font-size:14px}
.irow .num{padding-top:8px;text-align:right;color:var(--ink2)}
.irow.zero .nm,.irow.zero .num{color:var(--muted)}
.irow input[type=number]{text-align:right}
.irow .o1{display:grid;gap:6px}
.irow .o1 label{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2)}
.intake-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

/* register */
table.rg{border-collapse:collapse;width:100%;min-width:960px;font-size:14px}
.rg th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0}
.rg td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
.rg td.q{text-align:right}
.rg .tt{font-weight:500}
.rg .sub2{font-size:12.5px;color:var(--muted)}
.rg tr.sel td{background:var(--primary-soft)}
.bulk{display:flex;gap:10px;align-items:center;padding:10px 18px;background:var(--primary-soft);font-size:14px}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.set-grid .panel-b p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.krmap{display:grid;grid-template-columns:28px minmax(0,1fr) 120px minmax(0,1.4fr);gap:8px 12px;align-items:center;font-size:13.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,28,.48);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto}
.modal.open{display:flex}
.dialog{background:var(--surface);border-radius:12px;width:min(640px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dialog-h{padding:18px 22px 4px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dialog-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.dialog-b{padding:14px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dialog-b .full{grid-column:1/-1}
.dialog.wide{width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column}
.dialog.wide .dialog-b{overflow-y:auto;min-height:0}
.dialog.wide .dialog-h,.dialog.wide .dialog-f{flex:none}
.dialog-b.pf{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.pf .s1{grid-column:span 1}.pf .s2{grid-column:span 2}.pf .s4{grid-column:1/-1}
.pf .sec{grid-column:1/-1;margin:10px 0 0;padding-top:12px;border-top:1px solid var(--line2);font-size:14.5px;color:var(--primary)}
.pf .sec:first-child{margin-top:0;padding-top:0;border-top:0}
.pf div.f{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:180px minmax(0,1fr) 32px;gap:8px;align-items:start;margin-bottom:6px}
.pf input[readonly]{background:var(--sunk);color:var(--muted)}
.dialog-f{padding:14px 22px 18px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line2)}
.dialog-f .r{display:flex;gap:8px;margin-left:auto}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--ink)}
.radio input{accent-color:var(--primary)}
.radio label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:20px}
.x:hover{background:var(--sunk)}
.tg-grid{display:grid;grid-template-columns:28px minmax(0,1fr) 90px;gap:8px 12px;align-items:center;font-size:14px}
.tg-grid .no{color:var(--muted);font-weight:700;text-align:right}
.tg-grid .ind{padding-left:16px;font-size:13px;color:var(--ink2)}

.yearbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 20px}
.yearbar .yl{font-size:13.5px;color:var(--ink2);font-weight:600}
.yearbar .chips button{font-size:14px;padding:5px 13px}
.yearbar .chips button.nodata{color:var(--muted);border-style:dashed}
.yearbar .chips button.nodata[aria-pressed="true"]{color:var(--surface)}
.yearbar .cnt{font-size:12px;opacity:.7;margin-left:2px}
.yearbar .sp{flex:1}
.empty-year{padding:36px 28px;text-align:left}
.empty-year h2{margin-bottom:6px}
.empty-year p{color:var(--ink2);max-width:62ch;margin:0 0 16px}
.imp-t{width:100%;border-collapse:collapse;font-size:14px}
.imp-t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.imp-t td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.imp-t select{width:auto;padding:5px 8px}
.warn{margin:0;padding-left:18px;font-size:13px;color:var(--risk)}
.yr-list{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:8px 14px;align-items:center;font-size:14px;margin-bottom:14px}
.yr-list b{font-size:15px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.tabbar{display:none}
.mtop{display:none}

@media (max-width:1100px){
  .ov-top{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .set-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:0 16px 96px}
  .mtop{display:flex;align-items:center;gap:10px;padding:12px 0;margin-bottom:6px}
  .mtop .mark{width:36px;height:36px;border:1px solid var(--line)}
  .mtop .mbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:9px;padding:6px 10px;font-size:13px;text-decoration:none;white-space:nowrap}
  .mtop .mbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mtop b{font-size:15px}
  .mtop .sp{flex:1}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--primary);font-weight:600}
  .tabbar .count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--pend);color:#1b1300;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;line-height:15px}
  h1{font-size:22px}
  .status-line{font-size:18px}
  .proj-head{padding:18px 16px}
  .proj-head h1{font-size:20px}
  .mx .pc{width:200px;min-width:200px;max-width:200px}
  .item-h{grid-template-columns:24px minmax(0,1fr) auto;row-gap:8px}
  .item-h .ibar{grid-column:2/4;grid-row:2}
  .item-h .icount{grid-column:3;grid-row:1}
  .item-h .add{grid-column:2/4;grid-row:3;justify-self:start}
  .sub{grid-template-columns:minmax(0,1fr) 90px;padding-right:0}
  .sub .ibar{display:none}
  .subs,.evs{margin-left:0}
  .more{margin-left:0}
  .ev{grid-template-columns:auto minmax(0,1fr)}
  .ev .acts{grid-column:2}
  .tabs{flex-wrap:wrap}
  .tabs .sp{flex-basis:100%;height:0}
  .tabs .btn.ghost{margin:4px 0}
  .intake-meta{grid-template-columns:1fr;padding:16px}
  .irow{grid-template-columns:24px minmax(0,1fr) 70px;padding:12px 16px}
  .irow.head{display:none}
  .irow .num{grid-column:3;grid-row:1}
  .irow .num.d{display:none}
  .irow .qty,.irow .det{grid-column:2/4}
  .irow .qty::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .dialog-b,.dialog-b.pf{grid-template-columns:1fr}
  .pf .s1,.pf .s2{grid-column:1/-1}
  .prow{grid-template-columns:minmax(0,1fr) 32px}
  .prow textarea{grid-column:1}
  .timebox{grid-template-columns:1fr}
  .tl{grid-template-columns:96px minmax(0,1fr) 42px}
  .toolbar{padding:12px 14px}
  .toolbar input[type=search]{max-width:none;flex:1 1 160px}
  .panel-h{padding:14px 14px 0}.panel-b{padding:12px 14px 14px}
  .krmap{grid-template-columns:24px minmax(0,1fr)}
  .partners li{grid-template-columns:1fr;gap:0}
  .krmap input{grid-column:2}
  .yearbar{gap:8px}
  .yearbar .yl{width:100%}
  .imp-t{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function seedProject(p){
  const o = JSON.parse(JSON.stringify(p)); const out = o.out, oc = o.oc; delete o.out; delete o.oc;
  return Object.assign(o, {id:p.contract, fy:p.fy || SEED.fy, start:'', end:'', note:'', targets:out, ocTargets:oc, targetLog:[]});
}
/* เมื่อไฟล์มีข้อมูลตั้งต้นชุดใหม่ (SEED.ver เพิ่มขึ้น) ให้เติมโครงการที่ยังไม่มีเข้าไปในข้อมูลเดิมของเครื่อง
   ไม่ทับเป้าหมาย วันที่สัญญา หรือผลงานที่บันทึกไว้ และเติมเฉพาะช่องข้อมูลโครงการที่ยังว่าง */
function mergeSeed(){
  if((S.seedVer || 1) >= (SEED.ver || 1)) return false;
  SEED.projects.forEach(sp => {
    const ex = S.projects.find(p => p.id === sp.contract);
    if(!ex){ S.projects.push(seedProject(sp)); return; }
    if(!ex.fy) ex.fy = sp.fy;
    if(sp.info && !ex.info) ex.info = JSON.parse(JSON.stringify(sp.info));
  });
  S.projects.sort((a, b) => a.fy - b.fy || a.seq - b.seq);
  S.seedVer = SEED.ver; return true;
}
function baseState(){
  return {
    v:1, fy:SEED.fy, analyst:'ต้นน้ำ', kr:JSON.parse(JSON.stringify(DEFAULT_KR)), entries:[], savedAt:null,
    seedVer: SEED.ver || 1,
    projects: SEED.projects.map(seedProject)
  };
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function demoState(){
  const st = baseState(); const R = rng(68);
  st.projects.forEach((p, i) => {
    const s = new Date(2025, 2 + Math.floor(R()*5), 1 + Math.floor(R()*27));
    const e = new Date(s); e.setFullYear(e.getFullYear() + (p.years||1)); e.setDate(e.getDate()-1);
    p.start = isoD(s); p.end = isoD(e);
    const elapsed = Math.max(0, Math.min(1, (TODAY - s) / (e - s)));
    const drive = Math.max(0, Math.min(1, elapsed * (0.45 + R()*0.9)));
    const add = (kind, item, sub, n, status, round) => { for(let k=0;k<n;k++){
      const d = new Date(s.getTime() + (TODAY - s) * (0.3 + R()*0.65));
      st.entries.push({id:uid()+k, pid:p.id, kind, item, sub, qty:1, title:'ตัวอย่างผลงาน ' + (itemDef(kind,item).short) + (sub ? ' (' + O1_SUBS.find(x=>x.id===sub).short + ')' : '') + ' ลำดับที่ ' + (k+1),
        f:{}, round, date:isoD(d > TODAY ? TODAY : d), link:'', note:'', status, by:'ต้นน้ำ', at:new Date().toISOString()});
    }};
    OUTPUTS.forEach(o => {
      if(o.id === 'O1'){ O1_SUBS.forEach(sb => { const t = p.targets.O1[sb.id]; if(!t) return;
        const ok = Math.min(t, Math.floor(t * drive)); const pd = Math.min(t-ok, R() < .4 ? 1 + Math.floor(R()*2) : 0);
        add('out','O1',sb.id,ok,'ok',ROUNDS[0]); add('out','O1',sb.id,pd,'pending',ROUNDS[1]); }); return; }
      const t = p.targets[o.id]; if(!t) return;
      let ok = Math.min(t, Math.floor(t * drive + (R() < .25 ? 1 : 0)));
      if(o.id === 'O8' && elapsed > .2) ok = Math.max(ok, 1);
      const pd = Math.min(t - ok, R() < .35 ? 1 : 0);
      add('out', o.id, null, ok, 'ok', ROUNDS[0]); add('out', o.id, null, pd, 'pending', ROUNDS[1]);
    });
    OUTCOMES.forEach(o => { const t = p.ocTargets[o.id]; if(!t) return;
      const ok = Math.min(t, Math.floor(t * drive * 0.7)); add('oc', o.id, null, Math.min(ok, 12), 'ok', ROUNDS[0]); });
  });
  return st;
}
function load(){
  const ui = store(KEY_UI); if(ui){ try { const u = JSON.parse(ui); MODE = u.mode || 'real'; if(UI.fy == null && u.fy) UI.fy = u.fy; } catch(e){} }
  const raw = store(MODE === 'demo' ? KEY_DEMO : KEY_REAL);
  if(raw){ try { S = JSON.parse(raw); } catch(e){ S = null; } }
  if(!S || !S.projects){ S = MODE === 'demo' ? demoState() : baseState(); save(true); }
  if(!S.kr) S.kr = JSON.parse(JSON.stringify(DEFAULT_KR));
  S.projects.forEach(p => { if(!p.fy) p.fy = S.fy || SEED.fy; });
  if(mergeSeed()) save(true);
  const ys = S.projects.map(p => p.fy), yt = S.projects.filter(p => completion(p).n).map(p => p.fy);
  if(UI.fy == null || (UI.fy !== 'all' && !years().includes(UI.fy))) UI.fy = yt.length ? Math.max.apply(null, yt) : ys.length ? Math.max.apply(null, ys) : YEAR_RANGE[0];
  fixPid();
}
function save(quiet){
  S.savedAt = new Date().toISOString();
  store(MODE === 'demo' ? KEY_DEMO : KEY_REAL, JSON.stringify(S));
  saveUI(); renderSaved();
}

/* ---------- calc ---------- */
const P = id => S.projects.find(p => p.id === id);
function years(){ const set = new Set(YEAR_RANGE); S.projects.forEach(p => set.add(p.fy)); return Array.from(set).sort((a,b) => a - b); }
function scope(){ return UI.fy === 'all' ? S.projects : S.projects.filter(p => p.fy === UI.fy); }
function fixPid(){ const sc = scope(); if(!sc.some(p => p.id === UI.pid)) UI.pid = sc.length ? sc[0].id : null; }
const fyLabel = () => UI.fy === 'all' ? 'ทุกปีงบประมาณ' : 'ปีงบประมาณ ' + UI.fy;
function target(p, kind, item, sub){
  if(kind === 'oc') return +p.ocTargets[item] || 0;
  if(item === 'O1') return +(sub ? p.targets.O1[sub] : p.targets.O1.t) || 0;
  return +p.targets[item] || 0;
}
function got(pid, kind, item, sub){
  let ok = 0, pd = 0;
  for(const e of S.entries){ if(e.pid !== pid || e.kind !== kind || e.item !== item) continue; if(sub && e.sub !== sub) continue;
    if(e.status === 'ok') ok += +e.qty || 0; else pd += +e.qty || 0; }
  return {ok, pd};
}
function completion(p, kind){
  kind = kind || 'out'; let n = 0, sum = 0, done = 0;
  for(const it of itemsOf(kind)){ const t = target(p, kind, it.id); if(!t) continue; n++; const g = got(p.id, kind, it.id).ok; sum += Math.min(g/t, 1); if(g >= t) done++; }
  return {n, done, frac: n ? sum/n : null};
}
function timeFrac(p){ const s = parseD(p.start), e = parseD(p.end); if(!s || !e || e <= s) return null; return Math.max(0, Math.min(1, (TODAY - s)/(e - s))); }
function daysLeft(p){ const e = parseD(p.end); return e ? Math.round((e - TODAY)/86400000) : null; }
function status(p){
  const cc = completion(p), c = cc.frac, t = timeFrac(p), d = daysLeft(p);
  if(!cc.n) return {k:'nodate', l:'ยังไม่ได้กรอกเป้าหมาย'};
  if(c === 1) return {k:'done', l:'ครบตามเป้า'};
  if(d === null) return {k:'nodate', l:'ยังไม่ระบุวันสิ้นสุด'};
  if(d < 0) return {k:'late', l:'สิ้นสุดสัญญา ผลผลิตยังไม่ครบ'};
  if((t - (c||0)) > .25 || (d < 180 && (c||0) < .8)) return {k:'risk', l:'ต้องติดตามใกล้ชิด'};
  return {k:'track', l:'เป็นไปตามแผน'};
}
const pendingCount = () => S.entries.filter(e => e.status !== 'ok').length;
const ownerOf = p => (p.info && p.info.owner) || '';
function owners(){ return Array.from(new Set(scope().map(ownerOf).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'th')); }
function progOrder(p){ return S.projects.findIndex(x => x.fy === p.fy && x.program === p.program); }
function programs(){ const out = []; scope().forEach(p => { if(!out.includes(p.program)) out.push(p.program); }); return out; }

function pipsHTML(t, ok, pd){
  if(!t && !(ok+pd)) return '<span class="nil" aria-label="ไม่มีเป้าหมาย">–</span>';
  if(!t) return '<span class="over">+' + (ok+pd) + '</span>';
  if(t <= 10){
    let h = '<span class="pips' + (t < 5 ? ' n' + t : '') + '">';
    for(let i = 0; i < t; i++) h += '<i class="pip' + (i < ok ? ' a' : i < ok+pd ? ' p' : '') + '"></i>';
    h += '</span>';
    const extra = ok + pd - t; if(extra > 0) h += '<span class="over">+' + extra + '</span>';
    return h;
  }
  const a = Math.min(ok/t, 1)*100, b = Math.min(pd/t, 1 - a/100)*100;
  return '<span class="bigc"><b>' + nf(ok) + '</b>/' + nf(t) + '</span><span class="mini"><i class="a" style="width:' + a + '%"></i><i class="p" style="width:' + b + '%"></i></span>';
}
function sbarHTML(t, ok, pd){
  if(!t) return '<span class="sbar"></span>';
  const a = Math.min(ok/t,1)*100, b = Math.max(0, Math.min(pd/t*100, 100 - a));
  return '<span class="sbar" role="img" aria-label="ยืนยันแล้ว ' + ok + ' รอตรวจสอบ ' + pd + ' จากเป้าหมาย ' + t + '"><i class="a" style="width:' + a + '%"></i><i class="p" style="width:' + b + '%"></i></span>';
}

function loadXLSX(){

const normT = v => v == null ? '' : String(v).replace(/\s+/g, ' ').trim();
function numX(v){ if(v == null) return 0; if(typeof v === 'number') return isFinite(v) ? v : 0; const t = String(v).replace(/,/g, '').trim(); if(!t || t === '-' || t.charAt(0) === '=') return 0; const n = parseFloat(t); return isNaN(n) ? 0 : n; }
const PROG_ALIAS = {'British Council - ISPF Grant for International Research Collaboration':'British Council - ISPF'};
function cleanProg(t){ t = normT(t).replace(/^\((.*)\)$/, '$1').trim(); return PROG_ALIAS[t] || t; }
function closeParen(t){ t = normT(t); const o = (t.match(/\(/g) || []).length, c = (t.match(/\)/g) || []).length; return o > c ? t + ')'.repeat(o - c) : t; }
function toFY(d){ d = +d; if(!d) return null; if(d < 100) return 2500 + d; if(d >= 2500 && d < 2600) return d; if(d > 1950 && d < 2100) return d + 543; return null; }
function detectFY(sheet, contracts, fname){
  const m = String(sheet).match(/(\d{2,4})(?!.*\d)/); let y = m ? toFY(m[1]) : null;
  if(!y){ const c = contracts.map(x => (String(x).match(/^[A-Z]\d{2}[A-Z](\d{2})/) || [])[1]).filter(Boolean); if(c.length) y = toFY(c[0]); }
  if(!y){ const f = String(fname).match(/(25\d{2})/) || String(fname).match(/_(\d{2})(?!\d)/); if(f) y = toFY(f[1]); }
  return y;
}
function parseSheet(ws, sheetName, fname){
  const A = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true, blankrows:true});
  const B = r => normT((A[r] || [])[1]);
  const row = r => r < 0 ? [] : (A[r] || []);
  const find = (test, from, to) => { for(let r = from || 0; r < (to == null ? A.length : to); r++) if(test(B(r))) return r; return -1; };
  const rC = find(t => t.indexOf('เลขที่สัญญา') === 0); if(rC < 0) return null;
  const rOut = find(t => t.indexOf('ผลผลิต') === 0), rOc = find(t => t.indexOf('ผลลัพธ์') === 0, rOut + 1);
  const lim = rOut > 0 ? rOut : A.length; const f = t => find(t, 0, lim);
  const R = {prog:f(t => t.indexOf('โปรแกรม') === 0), seq:f(t => t.indexOf('ลำดับโครงการ') === 0), th:f(t => t.indexOf('(TH)') >= 0), en:f(t => t.indexOf('(EN)') >= 0),
    pi:f(t => t.indexOf('หัวหน้าโครงการ') === 0), inst:f(t => t === 'สถาบัน' || t === 'หน่วยงาน'), bud:f(t => t.indexOf('งบประมาณ') === 0),
    gbp:f(t => t.indexOf('GBP') >= 0), jpy:f(t => t.indexOf('Yen') >= 0 || t.indexOf('JPY') >= 0), php:f(t => t.indexOf('PHP') >= 0),
    thb:f(t => t.indexOf('THB') >= 0 && t.indexOf('Total') >= 0 && t.indexOf('+') < 0), yrs:f(t => t.indexOf('ระยะเวลา') === 0),
    thi:f(t => t.indexOf('สถาบันไทย') === 0), priv:f(t => t === 'เอกชน'), fo:f(t => t.indexOf('สถาบันนอก') === 0)};
  const warn = [];
  const cols = []; row(rC).forEach((v, c) => { const t = normT(v); if(c >= 2 && t && t !== 'รวม' && t.charAt(0) !== '=') cols.push(c); });
  if(!cols.length) return null;
  // program names: merged cells first, then carry forward
  const prog = {}; const pr = row(R.prog);
  cols.forEach(c => { prog[c] = cleanProg(pr[c]); });
  (ws['!merges'] || []).forEach(m => { if(m.s.r <= R.prog && m.e.r >= R.prog){ const v = cleanProg(pr[m.s.c]); for(let c = m.s.c; c <= m.e.c; c++) if(!prog[c]) prog[c] = v; } });
  let last = ''; cols.forEach(c => { if(prog[c]) last = prog[c]; else prog[c] = last; });
  // output / outcome rows
  const outR = {}, ocR = {}, subR = {};
  if(rOut < 0) warn.push('ไม่พบแถวหัวข้อ "ผลผลิต (Output)"');
  else { let cur = 0; for(let r = rOut + 1; r < (rOc > 0 ? rOc : A.length); r++){ const a = parseInt(normT(row(r)[0]), 10), b = B(r);
      if(a >= 1 && a <= 10){ outR[a] = r; cur = a; }
      else if(cur === 1 && b){ if(b.indexOf('สูง') === 0) subR.h = r; else if(b.indexOf('กลาง') === 0) subR.m = r; else if(b.indexOf('ต่ำ') === 0) subR.l = r; } } }
  if(rOc < 0) warn.push('ไม่พบแถวหัวข้อ "ผลลัพธ์ (Outcome)" เป้าหมาย Outcome จะเป็น 0');

function targetDiff(p, out, oc){
  const d = [];
  O1_SUBS.forEach(sb => { if((+p.targets.O1[sb.id]||0) !== (+out.O1[sb.id]||0)) d.push('ผลผลิต 1 ' + sb.short + ' ' + (p.targets.O1[sb.id]||0) + ' เป็น ' + (out.O1[sb.id]||0)); });
  OUTPUTS.slice(1).forEach(o => { if((+p.targets[o.id]||0) !== (+out[o.id]||0)) d.push('ผลผลิต ' + o.no + ' ' + (p.targets[o.id]||0) + ' เป็น ' + (out[o.id]||0)); });
  OUTCOMES.forEach(o => { if((+p.ocTargets[o.id]||0) !== (+oc[o.id]||0)) d.push('ผลลัพธ์ ' + o.no + ' ' + (p.ocTargets[o.id]||0) + ' เป็น ' + (oc[o.id]||0)); });
  return d;
}

async function handleXlsx(file){
  try { toast('กำลังอ่านไฟล์ ' + file.name); await loadXLSX(); }
  catch(e){ toast('โหลดตัวอ่าน Excel ไม่ได้ ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});

    if(!sheets.length){ toast('ไม่พบชีตที่มีแถว "เลขที่สัญญาโครงการ" ในคอลัมน์ B ใช้แบบฟอร์มเดียวกับชีต Output_68'); return; }

}

  h += '</form><div class="dialog-f">' + (isNew ? '' : '<button class="btn danger" type="button" data-act="project-del">ลบโครงการ</button>') + '<div class="r"><button class="btn" type="button" data-act="close">ยกเลิก</button><button class="btn pri" type="button" data-act="project-save" data-new="' + (isNew ? 1 : 0) + '">' + (isNew ? 'เพิ่มโครงการและกรอกเป้าหมาย' : 'บันทึกข้อมูลโครงการ') + '</button></div></div>';

}
function readProjectForm(){
  const fd = new FormData($('#pf')); const out = {top:{}, info:{}, yb:[]};
  PF.forEach(f => {
    if(f.sec || f.type === 'partners') return;
    let v = (fd.get('pf_' + f.k) || '').toString().trim();
    if(f.type === 'num' || f.type === 'year') v = v === '' ? (f.zero ? 0 : null) : +v;
    else if(v === '' && f.in) v = '';
    if(f.in === 'info') out.info[f.k] = v; else if(f.in === 'yb') out.yb[+f.k.slice(2)] = v; else out.top[f.k] = v;
  });
  out.info.partners = Array.from(document.querySelectorAll('#pf-partners .prow')).map(r => ({country:r.querySelector('[data-pc]').value.trim(), insts:r.querySelector('[data-pinst]').value.split('\n').map(x => x.trim()).filter(Boolean)})).filter(x => x.country || x.insts.length);
  const yb = out.yb.map(x => x == null ? null : x); while(yb.length && yb[yb.length - 1] == null) yb.pop();
  out.info.yearBudget = yb.map(x => x || 0);
  return out;
}
const showV = v => v == null || v === '' ? '(ว่าง)' : Array.isArray(v) ? (v.length ? v.map(x => typeof x === 'object' ? (x.country || '?') + ': ' + x.insts.join('/') : nf(x)).join('; ') : '(ว่าง)') : typeof v === 'number' ? nf(v) : /^\d{4}-\d{2}-\d{2}$/.test(v) ? fmtD(v) : String(v);
function projectDiff(p, r){
  const d = [];
  PF.forEach(f => {
    if(f.sec || f.k === 'contract') return;
    let before, after;
    if(f.type === 'partners'){ before = (p.info || {}).partners || []; after = r.info.partners; }
    else if(f.in === 'yb') return;
    else { before = pfGet(p, f); after = f.in === 'info' ? r.info[f.k] : r.top[f.k]; }
    const norm = v => v == null || v === '' ? '' : JSON.stringify(v);
    if(norm(before) !== norm(after)) d.push((f.l || 'ประเทศและหน่วยงานคู่ร่วม') + ': ' + showV(before) + ' เป็น ' + showV(after));
  });
  const yb0 = JSON.stringify(((p.info || {}).yearBudget || []).filter(x => x)), yb1 = JSON.stringify((r.info.yearBudget || []).filter(x => x));
  if(yb0 !== yb1) d.push('งบประมาณรายปี: ' + showV((p.info || {}).yearBudget || []) + ' เป็น ' + showV(r.info.yearBudget));
  return d;
}
function emptyTargets(){ const t = {O1:{t:0, h:0, m:0, l:0}}; OUTPUTS.slice(1).forEach(o => t[o.id] = 0); const c = {}; OUTCOMES.forEach(o => c[o.id] = 0); return [t, c]; }

  location.href = D3ONE_URL;
}
